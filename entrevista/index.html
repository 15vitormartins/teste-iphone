<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista teste</title>
<style>
body{font-family:-apple-system,sans-serif;margin:14px;max-width:560px}
h2{margin:0 0 4px}h3{margin:18px 0 6px}
button,select,input,textarea{font-size:17px;padding:12px;margin:4px 0;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #888}
button.g{background:#1a73e8;color:#fff;border:0}button.r{background:#b3261e;color:#fff;border:0}
#log{background:#eee;padding:8px;white-space:pre-wrap;font-size:13px;border-radius:8px}
.th{display:flex;flex-wrap:wrap;gap:6px}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px}
small{color:#555}
</style></head><body>
<h2>Entrevista (teste)</h2>
<small>Teste interno. Nada aqui vai para banco ou cliente.</small>
<label>Demanda<input id="dem" value="TESTE-001"></label>

<h3>1. Relato falado</h3>
<button id="fala" class="g">Falar (ditado)</button>
<textarea id="relato" rows="5" placeholder="O texto falado aparece aqui. Pode corrigir à mão."></textarea>
<button id="salvaRelato">Salvar relato</button>

<h3>2. Áudio (guarda o som)</h3>
<button id="gr" class="g">Gravar áudio</button>
<small>Cada gravação para sozinha em 35 s. Grave quantas quiser.</small>
<div id="audios"></div>

<h3>3. Fotos</h3>
<select id="campo"><option>Fachada</option><option>Sala</option><option>Cozinha</option><option>Quarto</option><option>Banheiro</option><option>Área externa</option><option>Outra</option></select>
<button class="g" onclick="document.getElementById('fotoCam').click()">Tirar foto agora</button>
<button onclick="document.getElementById('fotos').click()">Escolher da galeria (várias)</button>
<input id="fotoCam" type="file" accept="image/*" capture="environment" hidden>
<input id="fotos" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" multiple hidden>
<div class="th" id="th"></div>

<h3>Resultado</h3><pre id="log"></pre>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,collection,onSnapshot,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBH3naqCKGgu_LUt34l2yNZxblZ1Nmi0no",authDomain:"pragma-vistorias-app-cd4b8.firebaseapp.com",projectId:"pragma-vistorias-app-cd4b8",appId:"1:349483581845:web:6bb09205037faa7546769c"});
const db=getFirestore(app);
const $=id=>document.getElementById(id),log=t=>{$("log").textContent+=t+"\n"};
const D=()=>($("dem").value.trim()||"TESTE-001").replace(/[\/\s]/g,"_");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
log("Navegador: "+navigator.userAgent);

// ---- ouvir o que já está salvo
let unsubs=[];
function assistir(){unsubs.forEach(u=>u());unsubs=[];
 unsubs.push(onSnapshot(query(collection(db,"teste",D(),"fotos"),orderBy("criado")),s=>{
  $("th").innerHTML="";s.forEach(d=>{const x=d.data(),i=document.createElement("img");i.src=x.dados;i.title=x.campo;$("th").appendChild(i)});
  log("Fotos salvas nesta demanda: "+s.size)}));
 unsubs.push(onSnapshot(query(collection(db,"teste",D(),"audios"),orderBy("criado")),s=>{
  $("audios").innerHTML="";s.forEach(d=>{const x=d.data(),a=document.createElement("audio");a.controls=true;a.style.width="100%";a.src=x.dados;$("audios").appendChild(a)});
  log("Áudios salvos nesta demanda: "+s.size)}));}
$("dem").onchange=assistir;assistir();

// ---- 1. ditado
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,base="";
$("fala").onclick=()=>{
 if(rec){rec.stop();return}
 if(!SR){log("Ditado indisponível: use o microfone do teclado.");return}
 base=$("relato").value;rec=new SR();rec.lang="pt-BR";rec.interimResults=true;rec.continuous=true;
 let fin=base;
 rec.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=(fin?" ":"")+t.trim();else tmp+=t}
  $("relato").value=(fin+(tmp?" "+tmp:"")).trim()};
 rec.onerror=e=>log("Erro no ditado: "+e.error);
 rec.onend=()=>{rec=null;$("fala").textContent="Falar (ditado)";$("fala").className="g"};
 try{rec.start();$("fala").textContent="● Ouvindo. Toque para parar";$("fala").className="r"}catch(e){log("Erro: "+e.message);rec=null}};
$("salvaRelato").onclick=async()=>{try{await setDoc(doc(db,"teste",D()),{relato:$("relato").value,atualizado:serverTimestamp()},{merge:true});log("Relato salvo ("+$("relato").value.length+" caracteres).")}catch(e){log("ERRO ao salvar relato: "+e.message)}};

// ---- 2. áudio
let mr=null,chunks=[],tmr=null;
$("gr").onclick=async()=>{
 if(mr){mr.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
  mr=new MediaRecorder(s);chunks=[];
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=async()=>{clearTimeout(tmr);s.getTracks().forEach(t=>t.stop());const tipo=mr.mimeType;mr=null;$("gr").textContent="Gravar áudio";$("gr").className="g";
   const blob=new Blob(chunks,{type:tipo});
   if(blob.size>700000){log("Áudio grande demais ("+blob.size+" bytes). Grave um trecho menor.");return}
   const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
   try{await setDoc(doc(db,"teste",D(),"audios",uid()),{dados:b64,tipo,bytes:blob.size,criado:Date.now()});log("Áudio salvo: "+blob.size+" bytes, "+tipo)}catch(e){log("ERRO ao salvar áudio: "+e.message)}};
  mr.start();$("gr").textContent="● Gravando. Toque para parar";$("gr").className="r";tmr=setTimeout(()=>{if(mr)mr.stop()},35000);
 }catch(e){log("ERRO áudio: "+e.name+" - "+e.message)}};

// ---- 3. fotos (reduz para 1280 px, JPEG)
function reduzir(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.65))};
 img.onerror=()=>no(new Error("não consegui abrir a imagem ("+file.type+")"));img.src=u})}
$("fotos").onchange=$("fotoCam").onchange=async e=>{
 for(const f of e.target.files){
  try{const d=await reduzir(f);
   if(d.length>900000){log("Foto "+f.name+" ficou grande ("+d.length+"). Pulei.");continue}
   await setDoc(doc(db,"teste",D(),"fotos",uid()),{dados:d,campo:$("campo").value,nome:f.name,bytes:d.length,criado:Date.now()});
   log("Foto salva: "+f.name+" ("+Math.round(d.length/1024)+" KB)")
  }catch(x){log("ERRO foto "+f.name+": "+x.message)}}
 e.target.value=""};
</script></body></html>
